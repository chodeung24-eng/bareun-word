<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>바른말 탐정단 · 학생</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px; }
    .title-card { padding: 24px 20px; text-align: center; }
    .logo { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 12px;
            background: linear-gradient(180deg, #A98FEA, #6A4BC8);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(91, 63, 176, 0.3); }
    .title-card h1 { font-size: 36px; color: var(--violet-deep); }
    .title-card p { margin: 6px 0 0; font-size: 18px; }
    .form { padding: 22px 20px; margin-top: 16px; }
    .form label.lbl { display: block; font-size: 19px; margin: 0 0 8px; }
    .form .gap { height: 18px; }
    .hint { font-size: 15px; margin: 6px 0 0; }
    #codeInput { font-family: var(--font-en); font-weight: 700; font-size: 30px; letter-spacing: 8px; text-align: center; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .avatar-pick { border: 2.5px solid rgba(255, 255, 255, 0.95); background: rgba(255, 255, 255, 0.6);
                   border-radius: 20px; padding: 8px 0 6px; cursor: pointer; font-family: var(--font-ko);
                   display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
    .avatar-pick .emoji { font-size: 34px; line-height: 1.15; }
    .avatar-pick .nm { font-size: 14px; }
    .avatar-pick.on { background: linear-gradient(180deg, #D9CCF6, #A98FEA); border-color: #fff;
                      box-shadow: 0 0 0 3px var(--violet-deep); }
    #joinBtn { width: 100%; height: 68px; font-size: 26px; margin-top: 22px; }

    #waiting { text-align: center; padding-top: 30px; }
    #waiting .me-name { font-size: 32px; margin: 16px 0 22px; }
    .wait-card { padding: 26px 20px; font-size: 22px; line-height: 1.5; }
    .dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
    .dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--violet); animation: blink 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    .room-tag { margin-top: 18px; font-size: 17px; }
    .relink { display: inline-block; margin-top: 22px; font-size: 17px; color: var(--ink-soft); background: none; border: 0;
              text-decoration: underline; cursor: pointer; font-family: var(--font-ko); }

    .big-msg { text-align: center; padding-top: 70px; }
    .big-msg h1 { font-size: 54px; color: var(--violet-deep); }
    .big-msg .sub { font-size: 21px; margin-top: 14px; }
    #ended .score-card { margin-top: 24px; padding: 28px 20px; text-align: center; }
    #ended .score-card .num { font-family: var(--font-en); font-weight: 700; font-size: 64px; color: var(--violet-deep); line-height: 1.1; }
    #ended .score-card .lbl { font-size: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ================= 입장 ================= -->
    <section id="join" class="screen hidden">
      <div class="glass title-card">
        <div class="logo" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
        </div>
        <h1>바른말 탐정단</h1>
        <p class="muted">이름을 쓰고 동물 친구를 골라요</p>
      </div>

      <form class="glass form" id="joinForm" autocomplete="off">
        <label class="lbl" for="codeInput">방 번호</label>
        <input class="field" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000">
        <div class="gap"></div>
        <label class="lbl" for="nameInput">이름</label>
        <input class="field" id="nameInput" maxlength="10" placeholder="별명도 좋아요 (10자까지)">
        <p class="hint muted">진짜 이름 대신 별명을 써도 돼요.</p>
        <div class="gap"></div>
        <span class="lbl" style="display:block;font-size:19px;margin-bottom:8px">동물 친구</span>
        <div class="avatar-grid" id="avatarGrid" role="radiogroup" aria-label="동물 친구 고르기"></div>
        <button type="submit" class="jelly btn-violet" id="joinBtn">들어가기</button>
      </form>
    </section>

    <!-- ================= 대기 ================= -->
    <section id="waiting" class="screen hidden">
      <div id="meAvatar" class="pop"></div>
      <div class="me-name" id="meName"></div>
      <div class="glass wait-card">
        선생님이 시작하면<br>바로 문제가 나와요!
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <p class="room-tag muted" id="roomTag"></p>
      <button type="button" class="relink" id="relinkBtn">다른 이름으로 다시 들어가기</button>
    </section>

    <!-- ================= 게임 중 (문제는 다음 단계) ================= -->
    <section id="play" class="screen hidden">
      <div class="big-msg">
        <h1 class="pop">게임 시작!</h1>
        <p class="sub muted">문제 화면은 다음 단계에서 만들어요.</p>
      </div>
    </section>

    <!-- ================= 끝 ================= -->
    <section id="ended" class="screen hidden">
      <div class="big-msg" style="padding-top:40px">
        <div id="endAvatar"></div>
        <h1 class="pop" style="margin-top:14px">게임 끝!</h1>
      </div>
      <div class="glass score-card">
        <div class="lbl muted">내 점수</div>
        <div class="num" id="myScore">0</div>
        <div class="lbl">점</div>
      </div>
      <p class="muted" style="text-align:center;font-size:19px;margin-top:22px">선생님 화면에서 시상식을 함께 봐요!</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // ===================================================================
    // 바른말 탐정단 · 학생 화면
    // ===================================================================
    const PLAYER_KEY = 'bareun-player';
    const AVATAR_NAMES = { zebra: '얼룩말', panda: '판다', lion: '사자', tiger: '호랑이',
                           koala: '코알라', rabbit: '토끼', bear: '곰', fox: '여우' };
    const $ = (id) => document.getElementById(id);
    const urlCode = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '').slice(0, 4);

    let me = null;          // { player_id, token, room_id, name, avatar, code }
    let pickedAvatar = null;
    let watcher = null;

    function show(id) {
      for (const s of document.querySelectorAll('.screen')) s.classList.toggle('hidden', s.id !== id);
      window.scrollTo(0, 0);
    }
    function loadMe() {
      try { return JSON.parse(sessionStorage.getItem(PLAYER_KEY)); } catch { return null; }
    }
    function clearMe() {
      sessionStorage.removeItem(PLAYER_KEY);
      me = null;
      if (watcher) { watcher.stop(); watcher = null; }
    }

    // ---------------- 입장 화면 ----------------
    function renderAvatars() {
      const grid = $('avatarGrid');
      grid.replaceChildren(...Object.keys(AVATARS).map((key) =>
        el('button', {
          type: 'button',
          class: 'avatar-pick' + (pickedAvatar === key ? ' on' : ''),
          role: 'radio',
          'aria-checked': pickedAvatar === key ? 'true' : 'false',
          'aria-label': AVATAR_NAMES[key],
          onclick: () => { pickedAvatar = key; renderAvatars(); }
        }, el('span', { class: 'emoji' }, AVATARS[key]), el('span', { class: 'nm' }, AVATAR_NAMES[key]))));
    }

    function showJoin() {
      $('codeInput').value = urlCode || $('codeInput').value;
      renderAvatars();
      show('join');
    }

    $('codeInput').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });

    $('joinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = $('codeInput').value.trim();
      const name = $('nameInput').value.trim();
      if (!/^\d{4}$/.test(code)) { toast('방 번호 4자리를 써 주세요.'); return; }
      if (!name) { toast('이름을 써 주세요.'); return; }
      if (!pickedAvatar) { toast('동물 친구를 하나 골라 주세요.'); return; }

      const btn = $('joinBtn');
      btn.disabled = true;
      try {
        const r = await call('join_room', { p_code: code, p_name: name, p_avatar: pickedAvatar });
        me = { player_id: r.player_id, token: r.token, room_id: r.room_id, name, avatar: pickedAvatar, code };
        sessionStorage.setItem(PLAYER_KEY, JSON.stringify(me));
        enterWaiting();
      } catch (err) {
        toast(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // ---------------- 대기 화면 ----------------
    function enterWaiting() {
      shownStatus = 'waiting';
      $('meAvatar').replaceChildren(avatarEl({ id: me.player_id, avatar: me.avatar }, 120));
      $('meName').textContent = me.name;
      $('roomTag').textContent = '방 번호 ' + me.code;
      show('waiting');
      startWatch();
    }

    function startWatch() {
      if (watcher) watcher.stop();
      watcher = watch({
        name: 'player-' + me.player_id,
        tables: [{ table: 'rooms', filter: 'id=eq.' + me.room_id }],
        onChange: (payload) => {
          if (payload.eventType === 'DELETE') applyRoom(null);
          else applyRoom(payload.new);
        },
        refresh: refreshRoom
      });
    }

    async function refreshRoom() {
      if (!me) return;
      const { data, error } = await db.from('rooms').select('*').eq('id', me.room_id).maybeSingle();
      if (error) { console.warn(error); return; }
      applyRoom(data);
    }

    // 방 상태가 바뀔 때마다 여기로: waiting → 대기, playing → 문제, ended → 내 점수
    let shownStatus = null;
    function applyRoom(row) {
      if (!me) return;
      if (!row) {
        clearMe();
        shownStatus = null;
        showJoin();
        toast('선생님이 방을 닫았어요.');
        return;
      }
      if (row.status === shownStatus) return;        // 같은 상태면 다시 그리지 않음
      shownStatus = row.status;
      if (row.status === 'waiting') {
        show('waiting');
      } else if (row.status === 'playing') {
        show('play');
      } else {
        showEnded();
      }
    }

    async function showEnded() {
      $('endAvatar').replaceChildren(avatarEl({ id: me.player_id, avatar: me.avatar }, 96));
      show('ended');
      const { data } = await db.from('players').select('*').eq('id', me.player_id).maybeSingle();
      $('myScore').textContent = data ? String(data.score) : '0';
    }

    $('relinkBtn').addEventListener('click', () => {
      clearMe();
      $('nameInput').value = '';
      pickedAvatar = null;
      showJoin();
    });

    // ---------------- 처음 열 때 ----------------
    // 서버 시계 맞추기 (모든 휴대폰이 같은 남은 시간을 보도록)
    (async () => {
      try { const sentAt = Date.now(); syncClock(await call('server_time'), sentAt); } catch (e) { console.warn(e); }
    })();

    (function init() {
      const saved = loadMe();
      if (saved && saved.player_id && (!urlCode || saved.code === urlCode)) {
        me = saved;
        enterWaiting();
        return;
      }
      if (saved) sessionStorage.removeItem(PLAYER_KEY);   // 다른 방 주소로 왔으면 새로 입장
      showJoin();
    })();
  </script>
</body>
</html>
