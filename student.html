<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>바른말 탐정단 · 학생</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px; }
    .title-card { padding: 24px 20px; text-align: center; }
    .logo { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 12px;
            background: linear-gradient(180deg, #A98FEA, #6A4BC8);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(91, 63, 176, 0.3); }
    .title-card h1 { font-size: 36px; color: var(--violet-deep); }
    .title-card p { margin: 6px 0 0; font-size: 18px; }
    .form { padding: 22px 20px; margin-top: 16px; }
    .form label.lbl { display: block; font-size: 19px; margin: 0 0 8px; }
    .form .gap { height: 18px; }
    .hint { font-size: 15px; margin: 6px 0 0; }
    #codeInput { font-family: var(--font-en); font-weight: 700; font-size: 30px; letter-spacing: 8px; text-align: center; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .avatar-pick { border: 2.5px solid rgba(255, 255, 255, 0.95); background: rgba(255, 255, 255, 0.6);
                   border-radius: 20px; padding: 8px 0 6px; cursor: pointer; font-family: var(--font-ko);
                   display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
    .avatar-pick .emoji { font-size: 34px; line-height: 1.15; }
    .avatar-pick .nm { font-size: 14px; }
    .avatar-pick.on { background: linear-gradient(180deg, #D9CCF6, #A98FEA); border-color: #fff;
                      box-shadow: 0 0 0 3px var(--violet-deep); }
    #joinBtn { width: 100%; height: 68px; font-size: 26px; margin-top: 22px; }

    #waiting { text-align: center; padding-top: 30px; }
    #waiting .me-name { font-size: 32px; margin: 16px 0 22px; }
    .wait-card { padding: 26px 20px; font-size: 22px; line-height: 1.5; }
    .dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
    .dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--violet); animation: blink 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    .room-tag { margin-top: 18px; font-size: 17px; }
    .relink { display: inline-block; margin-top: 22px; font-size: 17px; color: var(--ink-soft); background: none; border: 0;
              text-decoration: underline; cursor: pointer; font-family: var(--font-ko); }

    .big-msg { text-align: center; padding-top: 70px; }
    .big-msg h1 { font-size: 54px; color: var(--violet-deep); }
    .big-msg .sub { font-size: 21px; margin-top: 14px; }
    #ended .score-card { margin-top: 24px; padding: 28px 20px; text-align: center; }
    #ended .score-card .num { font-family: var(--font-en); font-weight: 700; font-size: 64px; color: var(--violet-deep); line-height: 1.1; }
    #ended .score-card .lbl { font-size: 20px; }
    #ended .me-name { font-size: 26px; margin-top: 10px; }
    #ended .place { font-family: var(--font-en); font-weight: 700; font-size: 96px; line-height: 1; color: var(--violet-deep); }
    #ended .place small { font-family: var(--font-ko); font-weight: 400; font-size: 40px; margin-left: 4px; }
    #ended .sub1 { font-size: 22px; margin-top: 10px; }
    #ended .sub2 { font-size: 18px; margin-top: 6px; }
    .top5 { margin-top: 18px; padding: 16px 18px; }
    .top5 h2 { font-size: 20px; margin-bottom: 8px; }
    .top5 ol { list-style: none; margin: 0; padding: 0; }
    .top5 li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 19px;
               border-bottom: 1.5px dashed rgba(139, 111, 214, 0.2); }
    .top5 li:last-child { border-bottom: 0; }
    .top5 .rk { width: 26px; text-align: center; font-family: var(--font-en); font-weight: 700; }
    .top5 .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top5 .sc { font-family: var(--font-en); font-weight: 700; }
    .top5 li.mine { color: var(--violet-deep); font-weight: 700; }
    .top5 li.mine .nm { font-size: 21px; }

    /* ---------- 문제 화면 ---------- */
    #play.screen { padding-bottom: 10px; }
    .me-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 22px; }
    .me-bar .nm { font-size: 20px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score-pill { background: linear-gradient(180deg, #A98FEA, #6A4BC8); color: #fff; font-size: 20px; padding: 6px 16px; }
    .score-pill b { font-family: var(--font-en); font-weight: 700; font-size: 22px; margin-right: 2px; }
    .q-meta { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 4px 6px; font-size: 19px; }
    .q-time { font-family: var(--font-en); font-weight: 700; font-size: 22px; }
    .q-time.hurry { color: var(--coral); }
    .progress { height: 8px; border-radius: 99px; background: rgba(139, 111, 214, 0.18); overflow: hidden; }
    .progress > div { height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, #A98FEA, #6A4BC8); transition: width 0.25s linear; }
    .progress.hurry > div { background: linear-gradient(90deg, #FF9AAE, #E85C7A); }
    .q-card { margin-top: 14px; padding: 22px 18px 26px; text-align: center; min-height: 190px;
              display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .q-label { background: rgba(255, 255, 255, 0.78); color: var(--violet-deep); font-size: 16px; padding: 5px 14px; }
    .q-text { font-size: 28px; line-height: 1.5; word-break: keep-all; }
    .blank { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--violet); margin: 0 4px;
             color: transparent; line-height: 1.1; }
    .explain { margin-top: 12px; padding: 14px 16px; font-size: 19px; line-height: 1.5; text-align: left;
               background: rgba(255, 248, 225, 0.85); }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .opts .jelly { height: 76px; font-size: 24px; padding: 0 8px; white-space: nowrap; overflow: hidden; }
    .opts .jelly.long { font-size: 20px; }
    .opts.ox .jelly { height: 110px; font-family: var(--font-en); font-weight: 700; font-size: 48px; }
    .opts .jelly.is-correct:disabled, .opts .jelly.is-wrong:disabled { filter: none; }
    .float-gain { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); z-index: 60; pointer-events: none;
                  font-family: var(--font-en); font-weight: 700; font-size: 64px; color: var(--green);
                  text-shadow: 0 4px 14px rgba(47, 163, 125, 0.35); }
    .float-gain span { display: block; animation: floatUp 0.9s ease-out forwards; }
    .time-up { margin-top: 18px; padding: 22px 16px; text-align: center; font-size: 24px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ================= 입장 ================= -->
    <section id="join" class="screen hidden">
      <div class="glass title-card">
        <div class="logo" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
        </div>
        <h1>바른말 탐정단</h1>
        <p class="muted">이름을 쓰고 동물 친구를 골라요</p>
      </div>

      <form class="glass form" id="joinForm" autocomplete="off">
        <label class="lbl" for="codeInput">방 번호</label>
        <input class="field" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000">
        <div class="gap"></div>
        <label class="lbl" for="nameInput">이름</label>
        <input class="field" id="nameInput" maxlength="10" placeholder="별명도 좋아요 (10자까지)">
        <p class="hint muted">진짜 이름 대신 별명을 써도 돼요.</p>
        <div class="gap"></div>
        <span class="lbl" style="display:block;font-size:19px;margin-bottom:8px">동물 친구</span>
        <div class="avatar-grid" id="avatarGrid" role="radiogroup" aria-label="동물 친구 고르기"></div>
        <button type="submit" class="jelly btn-violet" id="joinBtn">들어가기</button>
      </form>
    </section>

    <!-- ================= 대기 ================= -->
    <section id="waiting" class="screen hidden">
      <div id="meAvatar" class="pop"></div>
      <div class="me-name" id="meName"></div>
      <div class="glass wait-card">
        선생님이 시작하면<br>바로 문제가 나와요!
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <p class="room-tag muted" id="roomTag"></p>
      <button type="button" class="relink" id="relinkBtn">다른 이름으로 다시 들어가기</button>
    </section>

    <!-- ================= 문제 풀기 ================= -->
    <section id="play" class="screen hidden">
      <div class="glass me-bar">
        <span id="playAvatar"></span>
        <span class="nm" id="playName"></span>
        <span class="pill score-pill"><b id="playScore">0</b>점</span>
      </div>
      <div class="q-meta">
        <span id="qNum">문제 1</span>
        <span class="q-time" id="qTime">00:00</span>
      </div>
      <div class="progress" id="progress"><div id="progressBar"></div></div>

      <div class="glass q-card" id="qCard">
        <span class="pill q-label" id="qLabel">준비 중</span>
        <div class="q-text" id="qText">문제를 가져오고 있어요…</div>
      </div>
      <div id="explainBox"></div>
      <div class="opts" id="opts"></div>
      <div class="glass time-up hidden" id="timeUp">⏰ 시간 끝!<br>선생님 화면을 보세요</div>
    </section>

    <!-- ================= 끝 ================= -->
    <section id="ended" class="screen hidden">
      <div class="big-msg" style="padding-top:26px">
        <div id="endAvatar"></div>
        <div class="me-name" id="endName"></div>
      </div>
      <div class="glass score-card pop">
        <div class="lbl muted">게임 끝! 나의 순위</div>
        <div class="place"><span id="myRank">-</span><small>등</small></div>
        <div class="sub1"><span id="myScore">0</span>점 · <span id="myTotal">0</span>명 중</div>
        <div class="sub2 muted" id="myDetail"></div>
      </div>
      <div class="glass top5">
        <h2>🏆 TOP 5</h2>
        <ol id="top5"></ol>
      </div>
      <p class="muted" style="text-align:center;font-size:18px;margin-top:18px">선생님 화면에서 시상식을 함께 봐요!</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // ===================================================================
    // 바른말 탐정단 · 학생 화면
    // ===================================================================
    const PLAYER_KEY = 'bareun-player';
    const AVATAR_NAMES = { zebra: '얼룩말', panda: '판다', lion: '사자', tiger: '호랑이',
                           koala: '코알라', rabbit: '토끼', bear: '곰', fox: '여우' };
    const $ = (id) => document.getElementById(id);
    const urlCode = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '').slice(0, 4);

    let me = null;          // { player_id, token, room_id, name, avatar, code }
    let pickedAvatar = null;
    let watcher = null;

    function show(id) {
      for (const s of document.querySelectorAll('.screen')) s.classList.toggle('hidden', s.id !== id);
      window.scrollTo(0, 0);
    }
    function loadMe() {
      try { return JSON.parse(sessionStorage.getItem(PLAYER_KEY)); } catch { return null; }
    }
    function clearMe() {
      sessionStorage.removeItem(PLAYER_KEY);
      me = null;
      if (watcher) { watcher.stop(); watcher = null; }
    }

    // ---------------- 입장 화면 ----------------
    function renderAvatars() {
      const grid = $('avatarGrid');
      grid.replaceChildren(...Object.keys(AVATARS).map((key) =>
        el('button', {
          type: 'button',
          class: 'avatar-pick' + (pickedAvatar === key ? ' on' : ''),
          role: 'radio',
          'aria-checked': pickedAvatar === key ? 'true' : 'false',
          'aria-label': AVATAR_NAMES[key],
          onclick: () => { pickedAvatar = key; renderAvatars(); }
        }, el('span', { class: 'emoji' }, AVATARS[key]), el('span', { class: 'nm' }, AVATAR_NAMES[key]))));
    }

    function showJoin() {
      $('codeInput').value = urlCode || $('codeInput').value;
      renderAvatars();
      show('join');
    }

    $('codeInput').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });

    $('joinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = $('codeInput').value.trim();
      const name = $('nameInput').value.trim();
      if (!/^\d{4}$/.test(code)) { toast('방 번호 4자리를 써 주세요.'); return; }
      if (!name) { toast('이름을 써 주세요.'); return; }
      if (!pickedAvatar) { toast('동물 친구를 하나 골라 주세요.'); return; }

      const btn = $('joinBtn');
      btn.disabled = true;
      try {
        const r = await call('join_room', { p_code: code, p_name: name, p_avatar: pickedAvatar });
        me = { player_id: r.player_id, token: r.token, room_id: r.room_id, name, avatar: pickedAvatar, code };
        sessionStorage.setItem(PLAYER_KEY, JSON.stringify(me));
        enterWaiting();
      } catch (err) {
        toast(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // ---------------- 대기 화면 ----------------
    function enterWaiting() {
      shownStatus = 'waiting';
      $('meAvatar').replaceChildren(avatarEl({ id: me.player_id, avatar: me.avatar }, 120));
      $('meName').textContent = me.name;
      $('roomTag').textContent = '방 번호 ' + me.code;
      show('waiting');
      startWatch();
    }

    function startWatch() {
      if (watcher) watcher.stop();
      watcher = watch({
        name: 'player-' + me.player_id,
        tables: [{ table: 'rooms', filter: 'id=eq.' + me.room_id }],
        onChange: (payload) => {
          if (payload.eventType === 'DELETE') applyRoom(null);
          else applyRoom(payload.new);
        },
        refresh: refreshRoom
      });
    }

    async function refreshRoom() {
      if (!me) return;
      const { data, error } = await db.from('rooms').select('*').eq('id', me.room_id).maybeSingle();
      if (error) { console.warn(error); return; }
      applyRoom(data);
    }

    // 방 상태가 바뀔 때마다 여기로: waiting → 대기, playing → 문제, ended → 내 점수
    let shownStatus = null;
    function applyRoom(row) {
      if (!me) return;
      if (!row) {
        clearMe();
        shownStatus = null;
        showJoin();
        toast('선생님이 방을 닫았어요.');
        return;
      }
      currentRoom = row;
      if (row.status === shownStatus) return;        // 같은 상태면 다시 그리지 않음
      shownStatus = row.status;
      if (row.status === 'waiting') {
        show('waiting');
      } else if (row.status === 'playing') {
        startPlay();
      } else {
        stopPlay();
        showEnded();
      }
    }

    // ---------------- 문제 풀기 ----------------
    let currentRoom = null;
    let qCount = 0;          // 지금 몇 번째 문제
    let busy = false;        // 답을 보내는 중이면 true (두 번 누르기 막기)
    let playTimer = null;
    let timeOver = false;

    async function startPlay() {
      timeOver = false;
      $('timeUp').classList.add('hidden');
      $('playAvatar').replaceChildren(avatarEl({ id: me.player_id, avatar: me.avatar }, 40));
      $('playName').textContent = me.name;
      show('play');
      // 새로고침해도 점수와 문제 번호가 이어지게
      const { data } = await db.from('players').select('*').eq('id', me.player_id).maybeSingle();
      if (data) { $('playScore').textContent = String(data.score); qCount = data.answered; }
      if (!playTimer) playTimer = setInterval(playTick, 250);
      playTick();
      try {
        const r = await call('next_question', { p_player: me.player_id, p_token: me.token });
        if (r.result === 'ok') drawQuestion(r.question);
        else refreshRoom();
      } catch (e) {
        toast(e.message);
      }
    }

    function stopPlay() {
      clearInterval(playTimer);
      playTimer = null;
    }

    function playTick() {
      if (!currentRoom || !currentRoom.ends_at) return;
      const left = secondsLeft(currentRoom.ends_at);
      const hurry = left <= 10;
      $('qTime').textContent = mmss(left);
      $('qTime').classList.toggle('hurry', hurry);
      $('progress').classList.toggle('hurry', hurry);
      $('progressBar').style.width = (Math.max(0, Math.min(1, left / currentRoom.duration_sec)) * 100) + '%';
      if (left <= 0 && !timeOver) {
        timeOver = true;
        lockOptions();
        $('timeUp').classList.remove('hidden');
      }
    }

    // "____" 를 보라색 밑줄 빈칸으로 (글자는 textContent 로만 넣음)
    function questionText(text) {
      const parts = String(text).split(/_{2,}/);
      const out = [];
      parts.forEach((part, i) => {
        if (i > 0) out.push(el('span', { class: 'blank', 'aria-label': '빈칸' }, '빈칸'));
        out.push(document.createTextNode(part));
      });
      return out;
    }

    function drawQuestion(q) {
      if (!q || timeOver) return;
      qCount += 1;
      busy = false;
      $('qNum').textContent = '문제 ' + qCount;
      $('qLabel').textContent = q.label;
      $('qText').replaceChildren(...questionText(q.text));
      $('qCard').classList.remove('pop'); void $('qCard').offsetWidth; $('qCard').classList.add('pop');
      $('explainBox').replaceChildren();

      const isOX = q.type === 'ox';
      const box = $('opts');
      box.className = 'opts' + (isOX ? ' ox' : '');
      box.replaceChildren(...q.options.map((o, i) => {
        let color = 'opt-' + (i + 1);
        if (isOX) color = o.value === 'O' ? 'opt-4' : 'opt-2';
        const long = !isOX && o.value.length >= 5;
        return el('button', {
          type: 'button',
          class: `jelly ${color}${long ? ' long' : ''}`,
          'data-value': o.value,
          onclick: () => choose(o.value)
        }, o.value);
      }));
    }

    function optionButtons() { return [...$('opts').querySelectorAll('button')]; }
    function lockOptions() { optionButtons().forEach((b) => (b.disabled = true)); }
    function findButton(value) { return optionButtons().find((b) => b.dataset.value === value); }

    function floatGain(n) {
      const f = el('div', { class: 'float-gain' }, el('span', {}, '+' + n));
      document.body.append(f);
      setTimeout(() => f.remove(), 950);
    }

    async function choose(value) {
      if (busy || timeOver) return;
      busy = true;
      lockOptions();
      const picked = findButton(value);
      let r;
      try {
        r = await call('submit_answer', { p_player: me.player_id, p_token: me.token, p_choice: value });
      } catch (e) {
        toast(e.message);
        busy = false;
        optionButtons().forEach((b) => (b.disabled = false));
        return;
      }

      if (r.result === 'correct') {
        picked.classList.add('is-correct');
        floatGain(r.gain + (r.bonus || 0));
        $('playScore').textContent = String(r.score);
        await wait(650);
        drawQuestion(r.next);
      } else if (r.result === 'wrong') {
        picked.classList.add('is-wrong', 'shake');
        const right = findButton(r.answer);
        if (right) right.classList.add('is-correct');
        if (r.explain) {
          $('explainBox').replaceChildren(el('div', { class: 'glass explain pop' }, '💡 ', r.explain));
        }
        await wait(2000);
        drawQuestion(r.next);
      } else if (r.result === 'wait') {
        await wait(400);
        busy = false;
        optionButtons().forEach((b) => (b.disabled = false));
      } else if (r.result === 'no_question') {
        drawQuestion(r.next);
      } else {
        // closed: 시간이 끝났거나 게임이 끝남
        refreshRoom();
      }
    }

    async function showEnded() {
      $('endAvatar').replaceChildren(avatarEl({ id: me.player_id, avatar: me.avatar }, 96));
      $('endName').textContent = me.name;
      show('ended');
      const { data, error } = await db.from('players').select('*').eq('room_id', me.room_id);
      if (error || !data) return;
      const list = sortPlayers(data);
      const idx = list.findIndex((p) => p.id === me.player_id);
      const mine = list[idx];
      $('myRank').textContent = idx >= 0 ? String(idx + 1) : '-';
      $('myScore').textContent = mine ? String(mine.score) : '0';
      $('myTotal').textContent = String(list.length);
      $('myDetail').textContent = mine ? `맞힌 문제 ${mine.correct}개 · 보너스 +${mine.bonus}` : '';
      $('top5').replaceChildren(...list.slice(0, 5).map((p, i) =>
        el('li', { class: p.id === me.player_id ? 'mine' : '' },
          el('span', { class: 'rk' }, String(i + 1)),
          avatarEl(p, 32),
          el('span', { class: 'nm' }, p.name),
          el('span', { class: 'sc' }, `${p.score}점`))));
    }

    $('relinkBtn').addEventListener('click', () => {
      clearMe();
      $('nameInput').value = '';
      pickedAvatar = null;
      showJoin();
    });

    // ---------------- 처음 열 때 ----------------
    // 서버 시계 맞추기 (모든 휴대폰이 같은 남은 시간을 보도록)
    (async () => {
      try { const sentAt = Date.now(); syncClock(await call('server_time'), sentAt); } catch (e) { console.warn(e); }
    })();

    (function init() {
      const saved = loadMe();
      if (saved && saved.player_id && (!urlCode || saved.code === urlCode)) {
        me = saved;
        enterWaiting();
        return;
      }
      if (saved) sessionStorage.removeItem(PLAYER_KEY);   // 다른 방 주소로 왔으면 새로 입장
      showJoin();
    })();
  </script>
</body>
</html>
